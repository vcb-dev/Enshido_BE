services:
  postgres:
    image: postgres:16-alpine
    container_name: enshido-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: enshido
      POSTGRES_PASSWORD: enshido
      POSTGRES_DB: enshido
    volumes:
      - enshido_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enshido -d enshido']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enshido_pg_data:
