# pnpm 11 chặn script cài đặt cho tới khi được duyệt từng gói. Thiếu một dòng ở đây là
# `pnpm install` thoát mã 1 (ERR_PNPM_IGNORED_BUILDS) và mọi `pnpm <script>` cũng dừng theo.
allowBuilds:
  # Sinh Prisma Client và tải query engine — thiếu là BE không chạy.
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # Native binding để băm mật khẩu.
  bcrypt: true
  # Hai gói dưới do jest 30 kéo về (jest-haste-map / jest-resolve), chỉ tăng tốc lúc chạy
  # test. Đều có binary prebuilt nên script chỉ chọn đúng bản cho máy.
  '@parcel/watcher': true
  unrs-resolver: true
