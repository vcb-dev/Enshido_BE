name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker_push:
        description: 'Chỉ migrate + redeploy, không build lại image'
        required: false
        default: false
        type: boolean

# Hai lần deploy chồng nhau sẽ chạy migrate song song trên cùng một DB thật,
# nên xếp hàng chờ chứ không hủy lần đang chạy giữa đường.
concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

env:
  IMAGE: viejhaf/enshido-be
  NODE_VERSION: '22'

jobs:
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Thiếu GitHub secret DATABASE_URL"
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Thiếu GitHub secret DIRECT_URL (schema.prisma khai báo directUrl)"
            exit 1
          fi
          # status trả về mã lỗi khi còn migration chưa áp — ở đây chỉ cần xem log.
          npx prisma migrate status || true
          npx prisma migrate deploy

  build-and-push:
    name: Push image
    needs: [migrate]
    # Image mới chỉ được đẩy lên khi DB đã sẵn sàng cho code mới.
    if: |
      needs.migrate.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_docker_push != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # buildx ghi cache layer vào Actions cache.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Railway kéo image theo manifest thường; bật provenance/sbom sẽ thành
          # manifest list và Railway không tìm được layer để chạy.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Redeploy Railway
    needs: [migrate, build-and-push]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Mặc định là tên suy ra từ domain enshido-be-production-bf2b.up.railway.app.
      # Secret RAILWAY_SERVICE nhận tên hoặc service ID, dùng khi đổi tên service.
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || 'enshido-be' }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.58.0
      - name: Redeploy
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Thiếu GitHub secret RAILWAY_TOKEN (project token của Railway)"
            exit 1
          fi
          echo "Redeploy service: $RAILWAY_SERVICE"
          railway redeploy --service "$RAILWAY_SERVICE" --yes
